# Template: entrypoint của image nginx chạy envsubst trên file này (chỉ thay ${API_ORIGIN}).
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;

    # Header tối thiểu, khớp với những gì API tự set cho response của nó.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Docker embedded DNS. Cần khai báo resolver vì proxy_pass dưới đây dùng biến.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # API cùng origin với frontend: cookie refresh HttpOnly SameSite=Lax nhờ vậy mới được gửi kèm.
    location /api/ {
        # proxy_pass qua BIẾN chứ không phải hostname literal: với hostname literal, nginx resolve
        # ngay lúc khởi động và tự chết nếu API chưa lên ("host not found in upstream"). Dùng biến
        # thì resolve lúc có request, nên web vẫn phục vụ được static khi API đang restart.
        # Đánh đổi: phải nối $request_uri thủ công, vì proxy_pass dạng biến không tự truyền URI.
        set $api_origin ${API_ORIGIN};
        proxy_pass         $api_origin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Rate limit "auth" phân vùng theo IP, nên API phải thấy IP thật chứ không phải IP của nginx.
        # Cấu hình ForwardedHeaders ở API trước khi tin header này ngoài mạng nội bộ.
    }

    # Asset có hash trong tên nên cache dài được; index.html thì không, nếu không người dùng
    # sẽ dính bản cũ sau mỗi lần deploy.
    # Chỉ dùng `expires`, KHÔNG dùng add_header: một add_header trong location sẽ xoá toàn bộ
    # add_header thừa hưởng từ server, tức là mất hai security header ở trên.
    location /assets/ {
        expires 1y;
    }

    # SPA fallback: mọi route do react-router xử lý, không có file tương ứng trên đĩa.
    location / {
        try_files $uri $uri/ /index.html;
        # `expires -1` cho Cache-Control: no-cache mà không phá inherit như add_header.
        expires -1;
    }
}
